services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: civil-agent-api:local
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../config:/app/config:ro
      - ../backend:/app/backend:ro
      - ../src:/app/src:ro
      - ../vendors:/app/vendors:ro

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: civil-agent-worker:local
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: ["celery", "-A", "src.worker.celery_app", "worker",
              "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../config:/app/config:ro
      - ../src:/app/src:ro
      - ../vendors:/app/vendors:ro

  flower:
    image: mher/flower:2.0
    command:
      - "celery"
      - "--broker=redis://redis:6379/0"
      - "flower"
      - "--port=5555"
      - "--basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: civil-agent-frontend:local
    ports:
      - "3000:80"
    depends_on:
      - api
