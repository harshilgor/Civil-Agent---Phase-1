[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-agent"
version = "0.1.0"
description = "Floor plan perception and fusion pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.6",
  "celery[redis]>=5.3",
  "redis>=5.0",
  "httpx>=0.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
