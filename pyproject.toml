[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civil-agent"
version = "0.2.0"
description = "Input / Building Understanding Layer — converts architectural inputs to a machine-readable Building Graph"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Schema & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Geometry & graph
    "shapely>=2.0.6",
    "networkx>=3.3",
    "numpy>=1.26.0",

    # CAD parsing
    "ezdxf>=1.3.0",

    # Image / CV basics
    "opencv-python-headless>=4.10.0",
    "Pillow>=10.4.0",

    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "segmentation-models-pytorch>=0.3.4",
    "ultralytics>=8.3.0",
    "paddleocr>=2.9.0",
    "paddlepaddle>=2.6.0",
    "Pillow>=10.4.0",
    "pdf2image>=1.17.0",
]
ifc = [
    "ifcopenshell>=0.8.0",
]
llm = [
    "anthropic>=0.39.0",
]
worker = [
    "celery[redis]>=5.4.0",
]
db = [
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.15.0",
]
s3 = [
    "boto3>=1.35.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
