<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>single-model scrappy</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 1rem auto; padding: 0 1rem; }
    pre { background: #111; color: #e0e0e0; padding: 0.75rem; overflow: auto; white-space: pre-wrap; }
    .err { color: #f66; }
    .ok { color: #6c6; }
    img { max-width: 100%; border: 1px solid #444; margin: 0.5rem 0; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; }
    #active { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Single model (scrappy)</h1>
  <p id="active">Active model: <strong id="modelName">…</strong></p>
  <p>
    <input type="file" id="file" accept="image/*" />
    <button type="button" id="go">Run</button>
  </p>
  <section>
    <h2>Errors</h2>
    <pre id="errors" class="err">(none yet)</pre>
  </section>
  <section>
    <h2>Raw JSON</h2>
    <pre id="json">{}</pre>
  </section>
  <section>
    <h2>Outputs</h2>
    <div id="imgs"></div>
  </section>
  <script>
    const api = (path) => {
      const base = window.location.origin;
      return base + path;
    };

    async function refreshActive() {
      try {
        const r = await fetch(api("/single-model/active-model"));
        const j = await r.json();
        document.getElementById("modelName").textContent = j.active_model || "?";
      } catch (e) {
        document.getElementById("modelName").textContent = "failed to load: " + e;
      }
    }

    function showErrors(payload) {
      const el = document.getElementById("errors");
      const lines = [];
      if (payload.errors && payload.errors.length) lines.push(...payload.errors);
      else lines.push("(no error strings)");
      if (payload.traceback) lines.push("\n--- traceback ---\n" + payload.traceback);
      if (!payload.errors?.length && !payload.traceback) el.className = "ok";
      else el.className = "err";
      el.textContent = lines.join("\n");
    }

    function artifactUrls(runId, payload) {
      const urls = [];
      const art = payload.artifacts || {};
      for (const k of Object.keys(art)) {
        const v = art[k];
        if (typeof v === "string" && v.endsWith(".png"))
          urls.push({ label: k, url: api("/single-model/artifacts/" + runId + "/" + encodeURIComponent(v)) });
      }
      for (const f of payload.artifact_files || []) {
        const u = api("/single-model/artifacts/" + runId + "/" + encodeURIComponent(f));
        if (!urls.some((x) => x.url === u)) urls.push({ label: f, url: u });
      }
      return urls;
    }

    document.getElementById("go").onclick = async () => {
      const input = document.getElementById("file");
      if (!input.files || !input.files[0]) {
        alert("pick a file");
        return;
      }
      const fd = new FormData();
      fd.append("file", input.files[0]);
      document.getElementById("json").textContent = "loading…";
      document.getElementById("imgs").innerHTML = "";
      try {
        const r = await fetch(api("/single-model/run"), { method: "POST", body: fd });
        const text = await r.text();
        let payload;
        try {
          payload = JSON.parse(text);
        } catch {
          payload = { parse_error: text, http_status: r.status };
        }
        document.getElementById("json").textContent = JSON.stringify(payload, null, 2);
        showErrors(payload);
        const runId = payload.run_id;
        const box = document.getElementById("imgs");
        if (!runId) {
          box.textContent = "No run_id in response";
          return;
        }
        const urls = artifactUrls(runId, payload);
        if (!urls.length) {
          box.textContent = payload.predicted ? "No PNG paths in response (check JSON)." : "Predict did not complete.";
          return;
        }
        for (const { label, url } of urls) {
          const p = document.createElement("p");
          p.textContent = label;
          box.appendChild(p);
          const im = document.createElement("img");
          im.src = url;
          im.alt = label;
          box.appendChild(im);
        }
      } catch (e) {
        document.getElementById("errors").className = "err";
        document.getElementById("errors").textContent = String(e);
        document.getElementById("json").textContent = "{}";
      }
    };

    refreshActive();
  </script>
</body>
</html>
