# Per-model: paths, trust weights, input specs, framework
defaults:
  device: auto
  batch_size: 1

models:
  cubicasa:
    framework: pytorch
    vendor_path: vendors/cubicasa
    weights: vendors/cubicasa/weights/model_best_val_loss_var.pkl
    trust_weight: 1.0
    input:
      channels: 3
      expected_size: [256, 256]

  deepfloorplan:
    framework: tensorflow
    vendor_path: vendors/tf2_deepfloorplan
    weights: vendors/tf2_deepfloorplan/weights
    trust_weight: 0.95
    input:
      channels: 3
      expected_size: [512, 512]

  roomformer:
    framework: pytorch
    vendor_path: vendors/roomformer
    weights: vendors/roomformer/checkpoints/roomformer_stru3d.pth
    trust_weight: 0.9
    input:
      channels: 1
      density_map_size: [256, 256]

  polyroom:
    framework: pytorch
    vendor_path: vendors/polyroom
    weights: vendors/polyroom/checkpoints
    trust_weight: 0.88
    input:
      channels: 1
      density_map_size: [256, 256]

  raster_to_graph:
    framework: pytorch
    vendor_path: vendors/raster_to_graph
    weights: vendors/raster_to_graph/weights
    trust_weight: 0.85
    input:
      channels: 3

  floorplan_transformation:
    framework: pytorch
    vendor_path: vendors/floorplan_transformation
    weights: vendors/floorplan_transformation/weights
    trust_weight: 0.82
    input:
      channels: 3
